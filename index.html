<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoyPerrito Mail</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #ffffff; color: #333; }
        
        /* Pantalla de Registro / Login inicial */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-card {
            background: #f8f9fa; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center;
            border: 1px solid #e1e4e8;
        }
        .auth-card h2 { margin-bottom: 20px; color: #1a73e8; }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .auth-card button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .auth-card button:hover { background: #1557b0; }

        /* Interfaz principal del correo (Blanca y limpia) */
        aside { width: 260px; background: #fdfdfd; border-right: 1px solid #e1e4e8; display: flex; flex-direction: column; padding: 20px; }
        aside h2 { margin-bottom: 20px; font-size: 1.3rem; color: #1a73e8; }
        aside ul { list-style: none; }
        aside li { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-weight: 500; color: #555; }
        aside li:hover { background: #f1f3f4; color: #1a73e8; }

        .email-list { width: 340px; background: #ffffff; border-right: 1px solid #e1e4e8; overflow-y: auto; }
        .email-item { padding: 15px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
        .email-item:hover { background: #f8f9fa; }
        .email-item h4 { font-size: 0.95rem; color: #202124; }
        .email-item p { font-size: 0.85rem; color: #5f6368; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .email-viewer { flex: 1; padding: 40px; background: #ffffff; display: flex; flex-direction: column; }
        .email-viewer h3 { margin-bottom: 20px; color: #202124; }
        .email-viewer input, .email-viewer textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #dadce0; border-radius: 6px; font-size: 0.95rem; }
        .email-viewer textarea { height: 200px; resize: none; }
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; align-self: flex-start; font-weight: 500; }
        .btn:hover { background: #1557b0; }

        .user-info { margin-top: auto; font-size: 0.85rem; color: #5f6368; border-top: 1px solid #e1e4e8; padding-top: 15px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2>🐶 SoyPerrito Mail</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #666;">Crea tu correo personalizado</p>
            <input type="text" id="username-input" placeholder="Tu nombre o usuario (ej: pablo)">
            <button onclick="crearCuenta()">Crear cuenta</button>
        </div>
    </div>

    <div id="mail-app" style="display: none; width: 100%; height: 100vh; display: flex;">
        <aside>
            <h2>SoyPerrito</h2>
            <ul>
                <li>📥 Bandeja de Entrada</li>
                <li>📤 Enviados</li>
                <li>🗑️ Papelera</li>
            </ul>
            <div class="user-info" id="display-email">
                usuario@soyperrito.com
            </div>
        </aside>

        <div class="email-list">
            <div class="email-item">
                <h4>Soporte SoyPerrito</h4>
                <p>¡Bienvenido a tu nuevo correo oficial @soyperrito.com!</p>
            </div>
        </div>

        <div class="email-viewer">
            <h3>Redactar nuevo mensaje</h3>
            <input type="email" id="to-email" placeholder="Para: (ejemplo@gmail.com u otro correo)">
            <input type="text" id="email-subject" placeholder="Asunto">
            <textarea id="email-body" placeholder="Escribe tu mensaje aquí..."></textarea>
            <button class="btn" onclick="enviarCorreo()">Enviar correo</button>
        </div>
    </div>

    <script>
        let usuarioActual = "";

        function crearCuenta() {
            const input = document.getElementById('username-input').value.trim().toLowerCase();
            if(!input) {
                alert("Por favor, introduce un nombre válido.");
                return;
            }
            
            // Generar el correo con el dominio solicitado
            usuarioActual = input + "@soyperrito.com";
            
            // Ocultar pantalla de registro y mostrar la app
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('mail-app').style.display = 'flex';
            document.getElementById('display-email').innerText = "Conectado como:\n" + usuarioActual;
        }

        function enviarCorreo() {
            const destinatario = document.getElementById('to-email').value;
            const asunto = document.getElementById('email-subject').value;
            const mensaje = document.getElementById('email-body').value;

            if(!destinatario || !asunto || !mensaje) {
                alert("Por favor, rellena todos los campos para enviar el correo.");
                return;
            }

            // Simulación de envío exitoso hacia cualquier otro correo externo
            alert(`¡Correo enviado con éxito desde ${usuarioActual} hacia ${destinatario}!\n\nAsunto: ${asunto}`);
            
            // Limpiar campos
            document.getElementById('to-email').value = '';
            document.getElementById('email-subject').value = '';
            document.getElementById('email-body').value = '';
        }
    </script>

</body>
  </html>
